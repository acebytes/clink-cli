# A stdio service: run with `docker compose run --rm --no-deps -T clink-mcp`.
# No CLI binaries, host credentials, network service, or provider keys are supplied.
services:
  clink-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: clink-mcp-server:local
    stdin_open: true
    tty: false
    network_mode: none
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:noexec,nosuid,size=100m,mode=1777
    healthcheck:
      test: ["CMD", "python", "/usr/local/bin/clink-healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
