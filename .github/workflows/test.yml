name: Manual offline checks

# This fork has no automatic build/release/publish triggers.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Prepare dependency wheels (networked preparation only)
        run: |
          python -m pip wheel --wheel-dir .ci-wheels -r requirements.txt -r requirements-dev.txt
          docker pull python:${{ matrix.python-version }}-slim
      - name: Run unit tests without network, host credentials or installed CLI agents
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:exec,nosuid,size=1g \
            --user "$(id -u):$(id -g)" -e HOME=/tmp/clink-home \
            -e PYTHONDONTWRITEBYTECODE=1 -e PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
            -v "$PWD:/work:ro" -w /work python:${{ matrix.python-version }}-slim \
            sh -ec 'mkdir -p "$HOME"; python -m venv /tmp/test-venv; \
              /tmp/test-venv/bin/pip install --no-index --find-links /work/.ci-wheels -r requirements.txt -r requirements-dev.txt; \
              /tmp/test-venv/bin/python -m pytest tests/ -m "not integration and not real_cli" \
                -p pytest_asyncio.plugin -p pytest_mock -p no:cacheprovider'
  quality-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Check source without autofix
        run: |
          python -m ruff check .
          python -m black --check .
          python -m isort --check-only .
      - name: Build distribution without publishing
        run: |
          python -m build
          python scripts/verify_distribution.py dist
