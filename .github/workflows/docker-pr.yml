name: Manual container check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build a local image only
        run: docker build --target runtime -t clink-mcp-server:check .
      - name: Check provider-free discovery as a non-root user without network or CLI authentication
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:noexec,nosuid,size=100m \
            clink-mcp-server:check python -c 'import asyncio, os; import server; assert os.getuid() != 0; assert len(asyncio.run(server.handle_list_tools())) == 18'
