name: MCP tool proposal
description: Propose a focused new MCP tool or extension
labels: ["enhancement"]
body:
  - type: input
    id: tool-name
    attributes:
      label: Proposed tool name
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: User need and existing alternatives
      description: Explain how this differs from the existing 18 tools and the clink native task actions.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example input and expected result
      description: Use synthetic content and omit credentials or private configuration.
      render: text
    validations:
      required: true
  - type: dropdown
    id: execution
    attributes:
      label: Intended execution
      options:
        - Local caller-driven guidance
        - Advisory CLI consultation
        - Explicit native execution
        - Unsure
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Capabilities and failure behavior
      description: Describe permission boundaries, admission needs, state/retention, and cancellation behavior where relevant.
