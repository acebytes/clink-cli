name: Feature request
description: Suggest an improvement to clink-mcp-server
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user need and a concrete example.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed behavior
      description: Explain which operation changes and what the user should observe.
    validations:
      required: true
  - type: dropdown
    id: operation
    attributes:
      label: Affected area
      options:
        - Consultation or analytical workflow
        - Native tasks
        - Programmatic generation
        - Project setup or configuration
        - Discovery or diagnostics
        - Documentation
        - Other
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and permission implications
      description: Describe existing approaches and any change to native capabilities, admission, state, or cleanup.
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to submit a pull request.
