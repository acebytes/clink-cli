name: Bug report
description: Report a reproducible clink-mcp-server problem
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Report security vulnerabilities privately using SECURITY.md. Exclude credentials, private paths, prompts, user records, and raw native session transcripts.
  - type: input
    id: version
    attributes:
      label: Clink version
      description: Use the MCP version tool or the installed distribution metadata. The launcher has no version option.
      placeholder: "0.2.1"
    validations:
      required: true
  - type: dropdown
    id: operation
    attributes:
      label: Affected operation
      options:
        - Installation or project setup
        - Local discovery
        - Consultation or analytical workflow
        - Native task start/status/followup/cancel
        - Programmatic generation
        - Container startup/local tools
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system/architecture, Python version, MCP client, and CLI name/version if relevant. Do not include credential values.
      placeholder: "macOS arm64; Python 3.12; Claude Code 2.1.304"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and expected result
      description: Give minimal steps with synthetic files and sanitized configuration. Include generation schema/model-selection kind or native action if relevant.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed result
      description: Include state/error code and whether effects occurred. Installation/login alone does not establish admission; note any CLI upgrade.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized diagnostics
      description: Include only relevant technical excerpts. Use existing logs/mcp_server.log or logs/mcp_activity.log; the launcher has no follow option. Exclude secrets, raw argv, prompts, and native session bodies.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues.
          required: true
        - label: I removed credentials and private content from this report.
          required: true
