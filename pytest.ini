[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts =
    -v
    --strict-markers
    --tb=short
markers =
    private_evidence: historical provenance checks requiring an explicitly pinned external private archive
    integration: opt-in external integration tests; may launch real CLI agents and consume subscription usage
    real_cli: opt-in installed CLI smoke or policy probes; never part of offline unit checks
