[project]
name = "clink-cli"
version = "0.2.2"
description = "Call installed CLI agents from scripts with JSON, or connect them to an MCP client"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "clink/resources/CODEX-LICENSE", "clink/resources/CODEX-NOTICE"]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0,<2",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/acebytes/clink-mcp-server"
Repository = "https://github.com/acebytes/clink-mcp-server"
Issues = "https://github.com/acebytes/clink-mcp-server/issues"

[project.scripts]
clink-mcp-server = "server:run"
clink = "clink.cli:main"

[tool.setuptools]
py-modules = ["server", "config"]
include-package-data = false

[tool.setuptools.packages.find]
include = ["tools*", "systemprompts*", "utils*", "conf", "clink*"]
exclude = ["providers*", "tests*", "simulator_tests*"]
namespaces = false

[tool.setuptools.package-data]
clink = [
    "resources/codex-0.166.0-models-direct.json",
    "resources/codex-0.166.0-models-generation.json",
    "resources/native-claude-2.1.304-admission.json",
    "resources/native-grok-1.0.70-admission.json",
    "resources/native-agy-1.4.12-admission.json",
    "resources/native-generation-codex-0.166.0-admission.json",
    "resources/native-generation-claude-2.1.304-admission.json",
    "resources/native-generation-grok-1.0.70-admission.json",
    "resources/PROVENANCE.md",
    "resources/CODEX-LICENSE",
    "resources/CODEX-NOTICE",
]
conf = ["cli_clients/*.json"]
systemprompts = ["clink/*.txt"]

[tool.black]
line-length = 120
target-version = ['py310', 'py311', 'py312', 'py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | \.pal_venv
  | venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
skip_gitignore = true
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 120
skip_glob = ["venv/*", ".venv/*", ".pal_venv/*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "UP045",  # Preserve existing Optional annotations during the workflow port.
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "B904",  # exception handling with raise from
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["B011"]
"tests/conftest.py" = ["E402"]  # Module level imports not at top of file - needed for test setup

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"
